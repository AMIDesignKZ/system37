name: System 37 build and validation

on:
  push:
    branches:
      - extended-firmware
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: system37-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python build dependency
        run: python -m pip install --upgrade pip Pillow

      - name: Install JieLi toolchain
        run: sh tools/get_toolchain.sh "$HOME/.jieli"

      - name: Fetch and verify the three pinned JieLi SDK package inputs
        run: |
          SDK="$HOME/fw-AC79_AIoT_SDK/cpu/wl82/tools"
          mkdir -p "$SDK/cfg"
          BASE="https://raw.githubusercontent.com/amitv87/fw-AC79_AIoT_SDK/release/AC79NN_SDK_V1.2.0/cpu/wl82/tools"
          curl -fL --retry 2 --connect-timeout 10 --max-time 60 "$BASE/uboot.boot" -o "$SDK/uboot.boot"
          curl -fL --retry 2 --connect-timeout 10 --max-time 60 "$BASE/cfg_tool.bin" -o "$SDK/cfg_tool.bin"
          curl -fL --retry 2 --connect-timeout 10 --max-time 60 "$BASE/cfg/eq_cfg_hw.bin" -o "$SDK/cfg/eq_cfg_hw.bin"
          echo "4e3b4c220dc96641cb5a723f41e68ce41d5261ae9434bb33fbd7f2c59976ded4  $SDK/uboot.boot" | sha256sum -c -
          echo "276579954f076886a6a7694f65dc71c034a63a2c204b76749065c0ac7b010d1b  $SDK/cfg_tool.bin" | sha256sum -c -
          echo "41167491bffed4651750719c973d2758adeb9021a5670d02d6a53c85ed80ea7d  $SDK/cfg/eq_cfg_hw.bin" | sha256sum -c -

      - name: Build System 37 SMK-37 Pro
        run: |
          BOARD=smk37 MODEL=pro sh build.sh
          python3 tests/smk_pkg_test.py build/system37.fwsc "SMK-37 Pro_900"

      - name: Build FM-1 reference for the legacy host and installer tests
        run: |
          # run_tests.sh exercises both the FM-1 code path and the SMK-37-specific
          # host fixtures. Its OTA, loader, web and target-disassembly checks
          # intentionally consume the FM-1 package at build/felucca.fwsc.
          # Never alias the Pro package here: its product identity and flash map
          # are deliberately different.
          BOARD=fm1 sh build.sh

      - name: Run host, sanitizer, target-budget and web test suite
        env:
          EDFZ_N: "2000"
        run: sh tests/run_tests.sh

      - name: Publish firmware packages and installer site
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: system37-build-${{ github.sha }}
          if-no-files-found: warn
          path: |
            build/system37.fwsc
            build/felucca.fwsc
            build/gen/felucca_fm6.h
            build/system37-site/
